name: Security Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bandit (SAST)
        run: bandit app.py -ll --exit-zero

      - name: Run Flask App in Background
        run: |
          python app.py &
          # Ждем пару секунд, пока приложение запустится
          sleep 3

      - name: Run OWASP ZAP API Scan (DAST)
        uses: zaproxy/action-api-scan@v0.6.0
        with:
          target: 'http://localhost:5000/api/users'
          format: 'html'
          output_file: 'zap_report.html'
          fail_action: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_report.html
